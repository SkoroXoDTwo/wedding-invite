services:
  caddy:
    image: caddy:2-alpine
    container_name: wedding_invite_caddy
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_invite_app
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wedding_invite_uploads:/app/public/uploads

  postgres:
    image: postgres:16-alpine
    container_name: wedding_invite_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - wedding_invite_pgdata:/var/lib/postgresql/data

volumes:
  caddy_data:
  caddy_config:
  wedding_invite_pgdata:
  wedding_invite_uploads:
