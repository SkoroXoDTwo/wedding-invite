services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wedding_invite_app
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - wedding_invite_uploads:/app/public/uploads

  postgres:
    image: postgres:16-alpine
    container_name: wedding_invite_postgres
    restart: unless-stopped
    env_file:
      - .env.production
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - wedding_invite_pgdata:/var/lib/postgresql/data

volumes:
  wedding_invite_pgdata:
  wedding_invite_uploads:
