# THIS IS AUTOGENERATED. DO NOT EDIT MANUALLY
version = 1
name = "New project 2"

[setup]
script = '''
$ErrorActionPreference = "Stop"

Write-Host "==> Checking Node.js and npm"

# Попробовать найти node/npm
$node = Get-Command node -ErrorAction SilentlyContinue
$npm = Get-Command npm -ErrorAction SilentlyContinue

if (-not $node) {
    Write-Host "Node.js не найден в PATH"
    Write-Host "Установи Node.js LTS: https://nodejs.org/"
    exit 1
}

if (-not $npm) {
    Write-Host "npm не найден в PATH"

    # Частые пути установки Node.js на Windows
    $possiblePaths = @(
        "C:\Program Files\nodejs",
        "$env:APPDATA\npm"
    )

    foreach ($path in $possiblePaths) {
        if (Test-Path $path) {
            $env:PATH = "$path;$env:PATH"
        }
    }

    $npm = Get-Command npm -ErrorAction SilentlyContinue

    if (-not $npm) {
        Write-Host "npm всё ещё не найден. Перезапусти терминал/IDE после установки Node.js."
        exit 1
    }
}

Write-Host "Node version:"
node -v

Write-Host "npm version:"
npm -v

Write-Host "==> Installing project dependencies"

if (Test-Path "package-lock.json") {
    npm ci
} else {
    npm install
}

Write-Host "==> Environment setup completed"
'''
